version: "3.9"

services:
  falcon-medical-qa:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: falcon-medical-qa:latest
    container_name: falcon-medical-qa
    runtime: nvidia                      # Requires nvidia-docker2
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      # Mount the LoRA adapter from host → container
      # Place peft_adapter/ inside docker/model/ before running
      - ./model/peft_adapter:/app/model/peft_adapter:ro
      # Cache HuggingFace downloads between runs
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
    driver: local
