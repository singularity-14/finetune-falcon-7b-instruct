# ============================================================
# Falcon-7B-Instruct Fine-Tuning Configuration
# ============================================================

# --- Model ---
model:
  name: "tiiuae/falcon-7b-instruct"
  trust_remote_code: true
  use_cache: false

# --- Quantization (BitsAndBytes 4-bit) ---
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

# --- LoRA ---
lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "query_key_value"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# --- Dataset ---
dataset:
  name: "GBaker/MedQA-USMLE-4-options"
  split: "train"
  train_samples: 2000
  eval_samples: 1000
  test_size: 0.2
  max_length: 512
  seed: 42

# --- Training ---
training:
  output_dir: "./outputs/results"
  logging_dir: "./outputs/logs"
  num_train_epochs: 10
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  save_total_limit: 2
  report_to: "tensorboard"
  label_names:
    - "labels"
  dataloader_num_workers: 0  # 0 = safe for Colab

# --- Early Stopping ---
early_stopping:
  patience: 3
  threshold: 0.0

# --- Saving ---
saving:
  final_model_dir: "./outputs/final_model"
  peft_adapter_dir: "./outputs/peft_adapter"

# --- Evaluation ---
evaluation:
  num_samples: 50         # samples for qualitative evaluation
  max_new_tokens: 200
  temperature: 0.7
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.1
